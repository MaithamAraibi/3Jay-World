# One-click deploy on Render (free tier works). Render supports WebSockets on web services.
services:
  - type: web
    name: arcanum-online
    runtime: node
    rootDir: multiplayer
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
