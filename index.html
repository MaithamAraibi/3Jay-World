<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcanum Meadow</title>
<style>
  :root{
    --gold:#f3d9a0; --gold2:#c9a35a; --ink:#140d06; --panel:rgba(14,10,6,.55);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:#f4ead4;

  canvas#c{display:block;position:fixed;inset:0;width:100vw;height:100vh;cursor:crosshair}

    border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,240,200,.12);backdrop-filter:blur(6px)}

    border:1px solid rgba(243,217,160,.22);background:#0c0906;transition:transform .18s, box-shadow .18s, border-color .18s;pointer-events:auto;cursor:pointer}
  .slot canvas{width:100%;height:100%;display:block}

  .slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%), transparent 0);}
  .slot.active{transform:translateY(3px) scale(1.09);border-color:var(--c,#fff);box-shadow:0 0 18px var(--c,#fff),0 0 4px var(--c,#fff) inset}
  #spellname{position:absolute;top:92px;left:50%;transform:translateX(-50%);font-size:22px;letter-spacing:4px;text-transform:uppercase;
    text-shadow:0 0 12px var(--c,#fff),0 2px 4px #000;transition:opacity .6s;white-space:nowrap}
  #spelldesc{position:absolute;top:122px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.75;letter-spacing:1px;text-shadow:0 1px 3px #000;transition:opacity .6s;white-space:nowrap}

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   0. CORE SETUP
   ===================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.04, 5000);
camera.rotation.order = 'YXZ';
scene.add(camera);

const LOWSPEC = /lowspec/.test(location.search);
const clock = new THREE.Clock();
const GLOBAL = { time: { value: 0 } };
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

/* =====================================================================
   1. MATH / NOISE UTILITIES
   ===================================================================== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(20261118);
const R = (a, b) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash2(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise2(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm2(x, y, oct = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let o = 0; o < oct; o++) { s += a * noise2(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }
// periodic (tileable) noise for textures
function pnoise(x, y, p) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const m = (k) => ((k % p) + p) % p;
  const a = hash2(m(i), m(j)), b = hash2(m(i + 1), m(j)), c = hash2(m(i), m(j + 1)), d = hash2(m(i + 1), m(j + 1));
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function pfbm(x, y, p, oct = 5) { let s = 0, a = 0.5, n = 0, f = 1; for (let o = 0; o < oct; o++) { s += a * pnoise(x * f, y * f, p * f); n += a; a *= 0.5; f *= 2; } return s / n; }

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _m1 = new THREE.Matrix4(), _c1 = new THREE.Color(), _e1 = new THREE.Euler();
const UP = new THREE.Vector3(0, 1, 0);

/* =====================================================================
   2. PROCEDURAL TEXTURES (canvas generated)
   ===================================================================== */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, srgb = true, repeat = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = MAX_ANISO; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter;
  return t;
}
function pixelTex(size, fn, srgb = true) {
  const c = makeCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const o = (y * size + x) * 4; const col = fn(x / size, y / size, x, y);
    d[o] = clamp(col[0], 0, 255); d[o + 1] = clamp(col[1], 0, 255); d[o + 2] = clamp(col[2], 0, 255); d[o + 3] = 255;
  }
  g.putImageData(img, 0, 0); return canvasTex(c, srgb);
}
function genStone() {
  const S = 256;
  const col = pixelTex(S, (u, v) => {
    const n = pfbm(u * 8, v * 8, 8, 5), n2 = pfbm(u * 32 + 5, v * 32 + 9, 32, 3), moss = smooth(0.58, 0.72, pfbm(u * 4 + 11, v * 4 + 3, 4, 4));
    let l = 0.55 + (n - 0.5) * 0.65 + (n2 - 0.5) * 0.25;
    const pit = n2 < 0.28 ? 0.7 : 1;
    let r = 150 * l * pit, g = 146 * l * pit, b = 136 * l * pit;
    r = lerp(r, 88 * l, moss * 0.75); g = lerp(g, 112 * l, moss * 0.75); b = lerp(b, 60 * l, moss * 0.75);
    return [r, g, b];
  });
  const bump = pixelTex(S, (u, v) => { const n = pfbm(u * 8, v * 8, 8, 5) * 0.6 + pfbm(u * 32 + 5, v * 32 + 9, 32, 3) * 0.4; const c = n * 255; return [c, c, c]; }, false);
  return { col, bump };
}
function genWood() {
  const S = 256;
  const col = pixelTex(S, (u, v) => {
    const w = pfbm(u * 2, v * 16, 2, 4);
    const rings = Math.sin((v * 22 + w * 6) * Math.PI) * 0.5 + 0.5;
    const fine = pnoise(u * 4, v * 128, 4);
    let l = 0.62 + rings * 0.22 + (fine - 0.5) * 0.2 + (w - 0.5) * 0.3;
    const knot = Math.max(0, 1 - Math.hypot((u - 0.3) * 3.5, (v - 0.6) * 12)) * 0.5;
    l *= 1 - knot;
    return [150 * l, 102 * l, 62 * l];
  });
  const bump = pixelTex(S, (u, v) => { const w = pfbm(u * 2, v * 16, 2, 4); const r = Math.sin((v * 22 + w * 6) * Math.PI) * 0.5 + 0.5; const c = (r * 0.6 + pnoise(u * 4, v * 128, 4) * 0.4) * 255; return [c, c, c]; }, false);
  return { col, bump };
}
function genRoof() {
  const S = 256;
  const col = pixelTex(S, (u, v) => {
    const n = pfbm(u * 6, v * 6, 6, 5), s = pnoise(u * 3, v * 40, 3);
    let l = 0.7 + (n - 0.5) * 0.5 + (s - 0.5) * 0.18;
    const edge = smooth(0.0, 0.12, v) * smooth(1.0, 0.85, v);
    l *= 0.72 + 0.28 * edge;
    return [176 * l, 58 * l, 40 * l];
  });
  const bump = pixelTex(S, (u, v) => { const c = (pfbm(u * 6, v * 6, 6, 5) * 0.5 + smooth(0, .12, v) * smooth(1, .85, v) * 0.5) * 255; return [c, c, c]; }, false);
  return { col, bump };
}
function genBark() {
  const S = 256;
  const col = pixelTex(S, (u, v) => {
    const n = pfbm(u * 12, v * 2, 12, 5), d = pfbm(u * 24 + 3, v * 4, 24, 3);
    let l = 0.45 + (n - 0.5) * 0.9; if (d < 0.38) l *= 0.55;
    return [112 * l, 80 * l, 56 * l];
  });
  const bump = pixelTex(S, (u, v) => { const n = pfbm(u * 12, v * 2, 12, 5); const d = pfbm(u * 24 + 3, v * 4, 24, 3); const c = (n * 0.7 + (d < .38 ? 0 : .3)) * 255; return [c, c, c]; }, false);
  return { col, bump };
}
function genGround() {
  const S = 512;
  return pixelTex(S, (u, v) => {
    const n = pfbm(u * 6, v * 6, 6, 5), n2 = pfbm(u * 40 + 2, v * 40 + 7, 40, 3);
    const dirt = smooth(0.62, 0.75, pfbm(u * 3 + 4, v * 3 + 1, 3, 4));
    let r = 92 + (n - .5) * 50 + (n2 - .5) * 40, g = 128 + (n - .5) * 60 + (n2 - .5) * 50, b = 48 + (n2 - .5) * 20;
    r = lerp(r, 120 + (n2 - .5) * 50, dirt * .6); g = lerp(g, 100 + (n2 - .5) * 40, dirt * .6); b = lerp(b, 66, dirt * .6);
    return [r, g, b];
  });
}

/* =====================================================================
   3. SKY, SUN, FOG, ENVIRONMENT LIGHTING
   ===================================================================== */
const SUN_ELEV = 22, SUN_AZ = 292;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - SUN_ELEV), THREE.MathUtils.degToRad(SUN_AZ));
const sky = new Sky();
sky.scale.setScalar(4500);
const su = sky.material.uniforms;
su.turbidity.value = 4.2; su.rayleigh.value = 1.35; su.mieCoefficient.value = 0.0045; su.mieDirectionalG.value = 0.86;
su.sunPosition.value.copy(sunDir);
scene.add(sky);

const FOG_COLOR = new THREE.Color(0xa9c3dc);
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0036);

// image based lighting from the procedural sky
{
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const sky2 = new Sky(); sky2.scale.setScalar(1000);
  for (const k in su) if (sky2.material.uniforms[k]) sky2.material.uniforms[k].value = su[k].value;
  envScene.add(sky2);
  // a ground disc so the lower hemisphere bounce reads as warm-green grass
  const gd = new THREE.Mesh(new THREE.SphereGeometry(400, 24, 12, 0, Math.PI * 2, Math.PI * 0.52, Math.PI * 0.48),
    new THREE.MeshBasicMaterial({ color: 0x41552a, side: THREE.BackSide }));
  envScene.add(gd);
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  scene.environmentIntensity = 0.9; // r163+ only; harmless otherwise
  pm.dispose();
}

const sun = new THREE.DirectionalLight(0xfff0d8, 3.4);
sun.castShadow = true;
const SHADOW_R = 62;
sun.shadow.mapSize.set(LOWSPEC ? 2048 : 4096, LOWSPEC ? 2048 : 4096);
sun.shadow.camera.left = -SHADOW_R; sun.shadow.camera.right = SHADOW_R;
sun.shadow.camera.top = SHADOW_R; sun.shadow.camera.bottom = -SHADOW_R;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 420;
sun.shadow.bias = -0.00025; sun.shadow.normalBias = 0.035;
sun.shadow.radius = 2.5;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x4d5a2c, 0.42);
scene.add(hemi);

// drifting procedural cloud layer
const cloudMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: { uTime: GLOBAL.time, uSun: { value: sunDir } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `
    varying vec3 vW; uniform float uTime; uniform vec3 uSun;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
    void main(){
      vec2 p = vW.xz*0.0016 + vec2(uTime*0.004, uTime*0.0016);
      float c = fbm(p); float c2 = fbm(p*2.2+3.1);
      float d = smoothstep(0.47, 0.78, c*0.75+c2*0.35);
      float edge = 1.0 - smoothstep(1100.0, 2600.0, length(vW.xz));
      vec3 lit = mix(vec3(0.72,0.76,0.84), vec3(1.0,0.97,0.92), smoothstep(0.3,0.9,c2));
      float sunGlow = pow(max(dot(normalize(vW), uSun),0.),6.0);
      lit += vec3(1.0,0.8,0.55)*sunGlow*0.6;
      gl_FragColor = vec4(lit, d*edge*0.9);
    }`
});
const clouds = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), cloudMat);
clouds.rotation.x = Math.PI / 2; clouds.position.y = 420; clouds.renderOrder = -1;
scene.add(clouds);

/* =====================================================================
   4. TERRAIN + MAGIC EFFECT MAP (scorch / frost / growth / heat)
   ===================================================================== */
const SITES = {
  tower: { x: -22, z: -32, r: 6.5 },
  cottage: { x: 17, z: -22, r: 9 },
  windmill: { x: 38, z: 6, r: 6.5 },
  ruins: { x: -30, z: 12, r: 13 },
};
function baseHeight(x, z) {
  const d = Math.hypot(x, z * 0.9 + 10);
  const gentle = (fbm2(x * 0.035 + 10, z * 0.035 - 3, 3) - 0.5) * 1.6 + Math.sin(x * 0.05) * 0.3;
  const hm = smooth(60, 170, d);
  const hills = Math.pow(fbm2(x * 0.0065 + 3, z * 0.0065 + 8, 5), 1.4) * 70 + fbm2(x * 0.03, z * 0.03, 3) * 6;
  return gentle + hm * hills;
}
for (const k in SITES) SITES[k].h = baseHeight(SITES[k].x, SITES[k].z);
function heightAt(x, z) {
  let h = baseHeight(x, z);
  for (const k in SITES) {
    const s = SITES[k]; const d = Math.hypot(x - s.x, z - s.z);
    if (d < s.r + 9) h = lerp(s.h, h, smooth(s.r, s.r + 9, d));
  }
  return h;
}
function groundNormal(x, z, out) {
  const e = 0.25;
  out.set(heightAt(x - e, z) - heightAt(x + e, z), 2 * e, heightAt(x, z - e) - heightAt(x, z + e)).normalize();
  return out;
}

const FXN = 512, FXH = 100;
const fxData = new Uint8Array(FXN * FXN * 4);
const fxTex = new THREE.DataTexture(fxData, FXN, FXN, THREE.RGBAFormat);
fxTex.magFilter = THREE.LinearFilter; fxTex.minFilter = THREE.LinearFilter; fxTex.needsUpdate = true;
let fxDirty = false;
// channel: 0 scorch, 1 frost, 2 lush, 3 heat
function stampFx(x, z, radius, ch, amount, opts = {}) {
  const cx = (x / (2 * FXH) + 0.5) * FXN, cz = (z / (2 * FXH) + 0.5) * FXN, rr = radius / (2 * FXH) * FXN;
  const x0 = Math.max(0, Math.floor(cx - rr)), x1 = Math.min(FXN - 1, Math.ceil(cx + rr));
  const z0 = Math.max(0, Math.floor(cz - rr)), z1 = Math.min(FXN - 1, Math.ceil(cz + rr));
  const nz = opts.noise ?? 0.5, seed = R(0, 100);
  for (let j = z0; j <= z1; j++) for (let i = x0; i <= x1; i++) {
    const dx = i - cx, dz = j - cz, d = Math.sqrt(dx * dx + dz * dz) / rr;
    if (d >= 1) continue;
    const ang = Math.atan2(dz, dx);
    const edge = 1 - nz * 0.45 * noise2(Math.cos(ang) * 3 + seed, Math.sin(ang) * 3 + seed);
    let f = 1 - smooth(edge * 0.55, edge, d);
    f *= 1 - nz * 0.35 * noise2(i * 0.25 + seed, j * 0.25);
    if (f <= 0) continue;
    const o = (j * FXN + i) * 4, v = amount * f * 255;
    fxData[o + ch] = Math.max(fxData[o + ch], Math.min(255, v));
    if (opts.clear) for (const c of opts.clear) fxData[o + c] = Math.max(0, fxData[o + c] - v * 1.5);
  }
  fxDirty = true;
}
let fxTick = 0, fxSlow = 0;
function updateFx(dt) {

    for (let i = 0; i < n; i++) {

      if (k < 5 && Math.abs(da) < 0.24) continue;

      for (const [k0, k1, angs] of winRings) if (k >= k0 && k <= k1) for (const wa of angs) { const d = Math.atan2(Math.sin(a - wa), Math.cos(a - wa)); if (Math.abs(d) < 0.16) skip = true; }
      if (skip) continue;

    for (let i = 0; i < cnt; i++) {
      const a = i / cnt * Math.PI * 2 + k * 0.3;

  }
  list.push(addPiece(K_ROOF, cx, topY + 0.35, cz, 0.6, 0.7, 0.6, qYaw(0.4), new THREE.Color(0x3c465c)));
  list.push(addPiece(K_WOOD, cx, topY + 1.3, cz, 0.09, 1.3, 0.09, qYaw(0), woodCol(0.6)));

function buildCottage(list) {
  const S = SITES.cottage, y0 = S.h, cx = S.x, cz = S.z;
  const W = 8.2, D = 6.2; // x by z
  const yaw = 0.18; const qy = qYaw(yaw);
  const cs = Math.cos(yaw), sn = Math.sin(yaw);
  const P = (lx, ly, lz) => [cx + lx * cs + lz * sn, y0 + ly, cz - lx * sn + lz * cs];
  const add = (kind, lx, ly, lz, sx, sy, sz, q, c) => { const [x, y, z] = P(lx, ly, lz); list.push(addPiece(kind, x, y, z, sx, sy, sz, q ? qy.clone().multiply(q) : qy, c)); };
  const rotY90 = qYaw(Math.PI / 2);
  // stone foundation, 2 courses
  for (let c = 0; c < 2; c++) {
    const y = 0.2 + c * 0.38, sh = c * 0.4;
    for (let x = -W / 2 + 0.4 + sh; x < W / 2 - 0.2; x += 0.82) { add(K_STONE, x, y, -D / 2, 0.78, 0.36, 0.5, null, stoneCol(0.95)); add(K_STONE, x, y, D / 2, 0.78, 0.36, 0.5, null, stoneCol(0.95)); }
    for (let z = -D / 2 + 0.75 + sh * 0.5; z < D / 2 - 0.4; z += 0.82) { add(K_STONE, -W / 2 + 0.05, y, z, 0.78, 0.36, 0.5, rotY90, stoneCol(0.95)); add(K_STONE, W / 2 - 0.05, y, z, 0.78, 0.36, 0.5, rotY90, stoneCol(0.95)); }
  }
  // log walls
  const lh = 0.3, wallY0 = 0.77, courses = 8;
  const doorX = 0.6, doorW = 1.3, winZ = [[-1.6, 1.2], [1.9, 1.2]];
  const seg = (z, x0, x1, y, alongX, gaps) => {
    // build a course from x0..x1 at z, skipping gaps [c,w]
    let cuts = [[x0, x1]];
    for (const [gc, gw] of gaps) {
      const nc = [];
      for (const [a, b] of cuts) { const g0 = gc - gw / 2, g1 = gc + gw / 2; if (g1 <= a || g0 >= b) nc.push([a, b]); else { if (g0 > a) nc.push([a, g0]); if (g1 < b) nc.push([g1, b]); } }
      cuts = nc;
    }
    for (const [a, b] of cuts) {
      const len = b - a; const nseg = Math.max(1, Math.round(len / 1.9)); const sl = len / nseg;
      for (let i = 0; i < nseg; i++) {
        const m = a + sl * (i + 0.5);
        if (alongX) add(K_WOOD, m, y, z, sl - 0.02, lh - 0.015, 0.24, null, woodCol());
        else add(K_WOOD, z, y, m, sl - 0.02, lh - 0.015, 0.24, rotY90, woodCol());
      }
    }
  };
  for (let c = 0; c < courses; c++) {
    const y = wallY0 + lh * (c + 0.5);
    const frontGaps = [], sideGaps = [];
    if (c < 7) frontGaps.push([doorX, doorW]);
    if (c >= 2 && c < 6) { frontGaps.push([-2.6, 1.1]); frontGaps.push([2.8, 1.1]); for (const g of winZ) sideGaps.push(g); }
    const ext = (c % 2) ? 0.12 : -0.12;
    seg(D / 2 - 0.1, -W / 2 + 0.1 + ext, W / 2 - 0.1 - ext, y, true, frontGaps);
    seg(-D / 2 + 0.1, -W / 2 + 0.1 + ext, W / 2 - 0.1 - ext, y, true, c >= 2 && c < 6 ? [[0, 1.4]] : []);
    seg(-W / 2 + 0.1, -D / 2 + 0.34 - ext, D / 2 - 0.34 + ext, y, false, sideGaps);
    seg(W / 2 - 0.1, -D / 2 + 0.34 - ext, D / 2 - 0.34 + ext, y, false, c >= 2 && c < 6 ? [[0, 1.3]] : []);
  }
  // lintels over openings
  const top = wallY0 + lh * courses;
  // door (vertical planks)
  for (let i = 0; i < 3; i++) add(K_WOOD, doorX - 0.42 + i * 0.42, wallY0 + 1.0, D / 2 - 0.02, 2.0, 0.4, 0.08, qEuler(0, 0, Math.PI / 2), woodCol(0.65));
  // gables on ±x ends (ridge along x)
  const ridgeH = 2.5, half = D / 2;
  for (let g = 0; g < 8; g++) {
    const y = top + lh * (g + 0.5); const w = (half - 0.25) * (1 - (g + 0.5) * lh / ridgeH) * 2;
    if (w < 0.35) break;
    for (const sx of [-1, 1]) {
      const nseg = w > 2.4 ? 2 : 1, sl = w / nseg;
      for (let i = 0; i < nseg; i++) add(K_WOOD, sx * (W / 2 - 0.1), y, -w / 2 + sl * (i + 0.5), sl - 0.02, lh - 0.015, 0.24, rotY90, woodCol(0.95));
    }
  }
  // beams: ridge + purlins
  for (const [lz, ly] of [[0, ridgeH - 0.05], [-1.55, ridgeH * 0.5 - 0.02], [1.55, ridgeH * 0.5 - 0.02]]) {
    for (let i = 0; i < 2; i++) add(K_WOOD, -W / 4 + i * W / 2, top + ly, lz, W / 2 + 0.35, 0.2, 0.2, null, woodCol(0.7));
  }
  // red tiled roof
  const slope = Math.atan2(ridgeH, half), slopeLen = Math.hypot(ridgeH, half) + 0.6;
  const rows = 8, rowL = slopeLen / rows, cols = 12, colW = (W + 1.2) / cols;
  for (const side of [-1, 1]) {
    for (let r = 0; r < rows; r++) {
      const t = (r + 0.5) / rows; const along = -0.6 + t * slopeLen;
      const lz = side * (half - Math.cos(slope) * along), ly = top + Math.sin(slope) * along + 0.18;
      for (let c = 0; c < cols; c++) {
        const lx = -W / 2 - 0.6 + colW * (c + 0.5) + (r % 2 ? colW * 0.25 : -colW * 0.25) * 0;
        add(K_ROOF, lx, ly, lz, colW - 0.04, 0.09, rowL + 0.1, qEuler(side * slope, 0, 0), new THREE.Color().setHSL(R(0.0, 0.025), R(0.55, 0.7), R(0.34, 0.44)));
      }
    }
  }
  // stone chimney
  for (let i = 0; i < 13; i++) {
    const y = 0.3 + i * 0.44, lx = W / 2 - 1.3, lz = -1.2;
    add(K_STONE, lx - 0.22, y, lz, 0.42, 0.42, 0.85, (i % 2) ? rotY90 : null, stoneCol(0.85));
    add(K_STONE, lx + 0.22, y, lz, 0.42, 0.42, 0.85, (i % 2) ? rotY90 : null, stoneCol(0.85));
    if (y > top + ridgeH + 0.8) break;
  }
}

function buildWindmill(list) {
  const S = SITES.windmill, y0 = S.h, cx = S.x, cz = S.z;
  const face = Math.atan2(22 - cz, 0 - cx);
  const rings = 12, bh = 0.55;
  for (let k = 0; k < rings; k++) {
    const t = k / rings, r = lerp(2.75, 2.05, t), n = Math.round(lerp(18, 14, t));
    const off = (k % 2) * Math.PI / n, y = y0 + bh * (k + 0.5) - 0.02;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + off;
      const da = Math.atan2(Math.sin(a - face), Math.cos(a - face));
      if (k < 4 && Math.abs(da) < 0.26) continue;
      list.push(addPiece(K_STONE, cx + Math.cos(a) * r, y, cz + Math.sin(a) * r, 2 * Math.PI * r / n - 0.04, bh - 0.025, 0.62, qYaw(-a - Math.PI / 2), stoneCol(1.08, 0.01)));
    }
  }
  // wooden cap house
  const yb = y0 + rings * bh, cw = 3.6, ch = 0.32, cc = 6;
  const q = qYaw(-face), cs = Math.cos(-face), sn = Math.sin(-face);
  const P = (lx, ly, lz) => [cx + lx * cs + lz * sn, yb + ly, cz - lx * sn + lz * cs];
  const add = (kind, lx, ly, lz, sx, sy, sz, qq, c) => { const [x, y, z] = P(lx, ly, lz); const p = addPiece(kind, x, y, z, sx, sy, sz, qq ? q.clone().multiply(qq) : q, c); list.push(p); return p; };
  for (let i = -3; i <= 3; i++) add(K_WOOD, i * 0.5, 0.08, 0, 0.48, 0.14, cw + 0.3, null, woodCol(0.8));
  const r90 = qYaw(Math.PI / 2);
  for (let c = 0; c < cc; c++) {
    const y = 0.15 + ch * (c + 0.5);
    for (const s of [-1, 1]) {
      add(K_WOOD, -cw / 4, y, s * cw / 2, cw / 2 - 0.02, ch - 0.015, 0.2, null, woodCol(0.85));
      add(K_WOOD, cw / 4, y, s * cw / 2, cw / 2 - 0.02, ch - 0.015, 0.2, null, woodCol(0.85));
      add(K_WOOD, s * cw / 2, y, -cw / 4 + 0.1, cw / 2 - 0.25, ch - 0.015, 0.2, r90, woodCol(0.85));
      add(K_WOOD, s * cw / 2, y, cw / 4 - 0.1, cw / 2 - 0.25, ch - 0.015, 0.2, r90, woodCol(0.85));
    }
  }
  const capTop = 0.15 + ch * cc;
  const sl = 0.62, rows = 5, rl = (cw / 2 + 0.4) / Math.cos(sl) / rows;
  for (const side of [-1, 1]) for (let r = 0; r < rows; r++) for (let c = 0; c < 5; c++) {
    const along = (r + 0.5) * rl;
    add(K_ROOF, -cw / 2 - 0.3 + (cw + 0.6) / 5 * (c + 0.5), capTop + 0.12 + Math.sin(sl) * along - 0.05, side * (cw / 2 + 0.4 - Math.cos(sl) * along), (cw + 0.6) / 5 - 0.04, 0.09, rl + 0.08, qEuler(side * sl, 0, 0), new THREE.Color().setHSL(0.07, 0.35, R(0.2, 0.27)));
  }
  // hub axle sticking out toward the meadow (local +x)
  const hub = add(K_WOOD, cw / 2 + 0.55, capTop * 0.55, 0, 1.3, 0.45, 0.45, null, woodCol(0.6));
  // sails: kinematic until their hub is destroyed
  const sails = [];
  const hubLocal = new THREE.Vector3(cw / 2 + 1.25, capTop * 0.55, 0);
  for (let i = 0; i < 4; i++) {
    const spar = addPiece(K_WOOD, 0, 0, 0, 0.16, 6.4, 0.16, null, woodCol(0.55));
    const sail = addPiece(K_CLOTH, 0, 0, 0, 1.25, 4.6, 0.05, null, new THREE.Color(0xf2e8d2).multiplyScalar(R(0.85, 1)));
    for (const [p, off] of [[spar, 0], [sail, 0.75]]) {
      if (!p) continue;
      p.state = S_KINE; kinematics.push(p); p.kIdx = i; p.kOff = off;
      p.supporters.push(hub); hub.dependents.push(p);
      p.kineVel = new THREE.Vector3(); p.kineW = new THREE.Vector3();
      sails.push(p);
    }
  }
  windmillRig = { cx, cz, P, q, hubLocal, sails, angle: 0, speed: 0.55, face };
}
function updateWindmill(dt) {
  if (!windmillRig) return;
  const W = windmillRig; W.angle += W.speed * dt;
  const [hx, hy, hz] = W.P(W.hubLocal.x, W.hubLocal.y, W.hubLocal.z);
  const axis = new THREE.Vector3(1, 0, 0).applyQuaternion(W.q);
  for (const p of W.sails) {
    if (p.state !== S_KINE) continue;
    const a = W.angle + p.kIdx * Math.PI / 2;
    const rot = new THREE.Quaternion().setFromAxisAngle(axis, a).multiply(W.q).multiply(qYaw(Math.PI / 2));
    // local up of the blade
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(rot);
    const side = new THREE.Vector3(1, 0, 0).applyQuaternion(rot);
    const dist = 3.45;
    p.x = hx + up.x * dist + side.x * p.kOff + axis.x * 0.12; p.y = hy + up.y * dist + side.y * p.kOff + axis.y * 0.12; p.z = hz + up.z * dist + side.z * p.kOff + axis.z * 0.12;
    p.qx = rot.x; p.qy = rot.y; p.qz = rot.z; p.qw = rot.w;
    // velocity if released now
    p.kineW.copy(axis).multiplyScalar(W.speed);
    p.kineVel.crossVectors(p.kineW, new THREE.Vector3(p.x - hx, p.y - hy, p.z - hz));
    p.writeMatrix();
  }
}

function buildRuins(list) {
  const S = SITES.ruins, y0 = S.h;
  const oldStone = () => stoneCol(0.85, 0.03);
  const wall = (x0, z0, ang, len, maxC, seed) => {
    const bw = 0.95, bh = 0.48, n = Math.floor(len / bw);
    const ca = Math.cos(ang), sa = Math.sin(ang), q = qYaw(ang);
    for (let i = 0; i < n; i++) {
      const prof = Math.max(1, Math.round(maxC * (0.35 + 0.65 * fbm2(i * 0.35 + seed, seed, 2)) - Math.abs(i - n / 2) * 0.2 * (rand() < 0.5 ? 1 : 0)));
      for (let c = 0; c < prof; c++) {
        const off = (c % 2) * bw * 0.5;
        if (i === n - 1 && off) continue;
        const along = (i + 0.5) * bw + off;
        for (const row of [-0.33, 0.33]) {
          if (c === prof - 1 && rand() < 0.3) continue;
          const x = x0 + ca * along - sa * row, z = z0 - sa * along - ca * row;
          // note: yaw -ang so local x maps to (cos ang, -sin ang)
          list.push(addPiece(K_STONE, x, y0 + bh * (c + 0.5) - 0.02, z, bw - 0.03, bh - 0.025, 0.64, q, oldStone()));
        }
      }
    }
  };
  wall(S.x - 9, S.z - 6, 0.05, 12, 9, 3.1);
  wall(S.x - 9.2, S.z - 5.6, -Math.PI / 2 + 0.05, 8, 7, 8.2);
  // arch
  {
    const ax = S.x + 4, az = S.z - 4, q = qYaw(0.5), ca = Math.cos(0.5), sa = Math.sin(0.5);
    const span = 3.2, ph = 6, dh = 0.55;
    for (const s of [-1, 1]) for (let i = 0; i < ph; i++) {
      const lx = s * (span / 2 + 0.45);
      list.push(addPiece(K_STONE, ax + ca * lx, y0 + dh * (i + 0.5) - 0.02, az - sa * lx, 0.9, dh - 0.025, 0.9, q, oldStone()));
    }
    const ny = 11, rA = span / 2 + 0.45, yb = y0 + ph * dh;
    for (let i = 0; i < ny; i++) {
      const t = (i + 0.5) / ny * Math.PI, lx = -Math.cos(t) * rA, ly = Math.sin(t) * rA;
      const qq = q.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), t - Math.PI / 2));
      list.push(addPiece(K_STONE, ax + ca * lx, yb + ly, az - sa * lx, 0.9, 0.5, 0.9, qq, oldStone()));
    }
    for (let i = -2; i <= 2; i++) list.push(addPiece(K_STONE, ax + ca * i * 0.9, yb + rA + 0.55, az - sa * i * 0.9, 0.88, 0.5, 0.9, q, oldStone()));
  }
  // colonnade of broken pillars
  for (let c = 0; c < 6; c++) {
    const px = S.x - 5 + c * 2.6, pz = S.z + 5.5 + Math.sin(c) * 0.4;
    const hgt = [7, 3, 6, 2, 8, 4][c];
    list.push(addPiece(K_STONE, px, y0 + 0.2, pz, 1.15, 0.4, 1.15, qYaw(c * 0.2), oldStone()));
    for (let i = 0; i < hgt; i++) list.push(addPiece(K_STONE, px, y0 + 0.4 + 0.6 * (i + 0.5) - 0.02, pz, 0.72, 0.58, 0.72, qYaw(c * 0.7 + i * 0.4), oldStone()));
    if (hgt > 5) list.push(addPiece(K_STONE, px, y0 + 0.4 + 0.6 * hgt + 0.18, pz, 1.1, 0.36, 1.1, qYaw(c), oldStone()));
  }
  // lintel slabs on two tall pillars
  // foundation outline
  for (let i = 0; i < 14; i++) list.push(addPiece(K_STONE, S.x - 6 + i * 1.0, y0 + 0.15, S.z + 1.2, 0.95, 0.3, 0.9, qYaw(R(-0.05, 0.05)), oldStone()));
  for (let i = 0; i < 9; i++) list.push(addPiece(K_STONE, S.x + 7.5, y0 + 0.15, S.z - 8 + i * 1.0, 0.9, 0.3, 0.95, qYaw(R(-0.05, 0.05)), oldStone()));
  // scattered fallen blocks
  for (let i = 0; i < 26; i++) {
    const a = R(0, 6.28), d = R(2, 12), x = S.x + Math.cos(a) * d, z = S.z + Math.sin(a) * d;
    const sx = R(0.6, 1.0), sy = R(0.35, 0.55), sz = R(0.5, 0.8);
    const q = qEuler(R(-0.15, 0.15), R(0, 6.28), R(-0.15, 0.15));
    list.push(addPiece(K_STONE, x, heightAt(x, z) + sy / 2 - 0.08, z, sx, sy, sz, q, oldStone()));
  }
}

function buildWorld() {
  const list = [];
  buildTower(list); buildCottage(list); buildRuins(list); buildWindmill(list);
  const statics = list.filter(p => p && p.state === S_SLEEP);
  finalizeStatic(statics);
  const orphans = statics.filter(p => !p.supporters.length && !p.grounded).length;
  if (orphans) console.log('[Arcanum] unsupported at build:', orphans);
  updateWindmill(0);
  return statics.length + kinematics.length;
}
function clearWorld() {
  for (const p of pieces) if (p.state !== S_DEAD) { if (p.state === S_KINE) p.state = S_SLEEP; killPiece(p); }
  pieces = []; activeList.length = 0; wakeQueue = []; pendingSupportWakes.length = 0; kinematics.length = 0; sgrid.clear();
  for (const k of KINDS) { k.free = []; k.high = 0; k.mesh.count = 0; for (let i = 0; i < k.cap; i++) k.mesh.setMatrixAt(i, ZERO_M); k.dirty = true; k.fx.array.fill(0); k.fxDirty = true; }
  fxData.fill(0); fxDirty = true;
}

/* =====================================================================
   10. GPU PARTICLES (instanced billboards: fire, smoke, sparks, frost…)
   ===================================================================== */
const SH_GLOW = 0, SH_FIRE = 1, SH_SPARK = 2, SH_SMOKE = 3, SH_STAR = 4, SH_PETAL = 5, SH_DUST = 6;
const PSTRIDE = 26;
class ParticleSystem {
  constructor(max, additive) {

    this.d = new Float32Array(max * PSTRIDE);

    g.setAttribute('position', new THREE.Float32BufferAttribute([-.5, -.5, 0, .5, -.5, 0, .5, .5, 0, -.5, .5, 0], 3));
    g.setIndex([0, 1, 2, 0, 2, 3]);
    this.aPos = new THREE.InstancedBufferAttribute(new Float32Array(max * 4), 4).setUsage(THREE.DynamicDrawUsage);
    this.aCol = new THREE.InstancedBufferAttribute(new Float32Array(max * 4), 4).setUsage(THREE.DynamicDrawUsage);

selectSpell(0);
const statsEl = document.getElementById('stats');
